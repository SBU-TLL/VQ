#ddev-generated
# DDEV-only Apache config for the local Shibboleth SP.
#
# TLS terminates at the DDEV router and Apache sees plain http on :80, so
# canonicalize the server URL to the router-exposed https URL. This is the
# standard Shibboleth-SP-behind-reverse-proxy recipe: mod_shib then computes
# handler/ACS URLs (and the SAML destination check) as https://<host>:443.
# ${DDEV_PRIMARY_URL} is e.g. "https://myproject.ddev.site" (container env).
ServerName ${DDEV_PRIMARY_URL}:443
UseCanonicalName On
ShibURLScheme https

<Location /Shibboleth.sso>
    SetHandler shib
    Require all granted
</Location>