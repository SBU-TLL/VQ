; DDEV local-dev PHP overrides for VQ (dev only; never deployed).
[PHP]
; Legacy 2017 code uses short-open tags (e.g. userCheck.php starts with "<?").
short_open_tag = On

; Load the fenced Shibboleth auth mock before every request. The mock itself
; is gated on ENVIRONMENT/APP_ENV=local, so this line is safe even if copied.
auto_prepend_file = /var/www/html/.ddev/php/shib_dev_prepend.php

; VQ stores/serves quiz videos (mp4) — allow large uploads locally
; (mirrors what production Apache/PHP is configured for).
upload_max_filesize = 1000M
post_max_size = 1000M
max_execution_time = 240
max_input_time = 240
memory_limit = 512M

; Surface errors during local development (kept off deprecations/notices noise).
display_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE & ~E_STRICT & ~E_WARNING
